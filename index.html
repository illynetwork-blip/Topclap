:root{
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#0A0F1E; --panel:#0F1629; --panel2:#151D36; --raise:#1C2544; --line:#1E2846; --line2:#2A365A;
  --fg:#EEF1FF; --muted:#95A1C6; --dim:#5D6A91;
  --dusk:#8B7CFF; --dusk-hi:#A99BFF; --dusk-ink:#FFFFFF; --violet:#8B7CFF; --rose:#FF6EC7; --teal:#00E3A0; --slate:#00D1FF; --danger:#FF5D73;
  --brand:#6C5CE7; --cyan:#00D1FF; --pink:#FF6EC7; --mint:#00FFA3; --night:#0F172A;
  --grad:linear-gradient(90deg,#6C5CE7 0%,#A35CF0 55%,#FF6EC7 100%);
  --grad-cool:linear-gradient(90deg,#8B7CFF,#00D1FF);
  --c-main:#2A3A78; --c-ov:#4B3C96; --c-text:#6C5CE7; --c-shape:#A04C93; --c-audio:#0E6F66; --c-color:#3A3F6B;
  --f-ui:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-disp:"Montserrat","Inter",system-ui,sans-serif;
  --f-mono:ui-monospace,"SF Mono","Cascadia Mono",Menlo,Consolas,monospace;
  --topH:52px; --railW:68px; --panelW:300px; --inspW:312px; --tlH:clamp(230px,34vh,380px);
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:13px/1.4 var(--f-ui);overflow:hidden;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--dusk);outline-offset:2px}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
svg.i.f{fill:currentColor;stroke:none}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--line2);border-radius:10px;border:2px solid transparent;background-clip:padding-box}::-webkit-scrollbar-track{background:transparent}

#app{display:grid;height:100%;grid-template-columns:var(--railW) var(--panelW) minmax(0,1fr) var(--inspW);grid-template-rows:var(--topH) minmax(0,1fr) var(--tlH);grid-template-areas:"top top top top" "rail panel stage insp" "tl tl tl tl";padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}

/* top bar */
#top{grid-area:top;display:flex;align-items:center;gap:10px;padding:0 12px;border-bottom:1px solid var(--line);background:var(--panel);min-width:0}
.logo{display:flex;align-items:center;gap:10px;white-space:nowrap}
.logo-mark{width:34px;height:34px;flex:none;display:block}
.logo-mark svg{width:100%;height:100%;display:block;filter:drop-shadow(0 4px 12px rgba(124,92,255,.35))}
.wm{display:flex;flex-direction:column;gap:3px;line-height:1}
.wm-t{font:800 19px/1 var(--f-disp);letter-spacing:-.02em;color:#fff}
.wm-t i{font-style:normal;background:var(--grad-cool);-webkit-background-clip:text;background-clip:text;color:transparent}
.wm small{font:600 7.5px var(--f-disp);letter-spacing:.42em;color:var(--muted)}
#projName{background:transparent;border:1px solid transparent;border-radius:8px;padding:6px 8px;width:220px;min-width:0;color:var(--fg)}
#projName:hover,#projName:focus{border-color:var(--line2);background:var(--panel2);outline:none}
.sp{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:34px;padding:0 12px;border-radius:9px;border:1px solid var(--line2);background:var(--panel2);color:var(--fg);white-space:nowrap;font-weight:500}
.btn:hover{background:var(--raise)}
.btn.icon{width:34px;padding:0}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--panel2)}
.btn.pri{background:var(--grad);border-color:transparent;color:#fff;font-weight:700;box-shadow:0 6px 20px rgba(163,92,240,.28)}
.btn.pri:hover{filter:brightness(1.1)}
.btn[disabled]{opacity:.4;pointer-events:none}
.btn.on{border-color:var(--dusk);color:var(--dusk)}
@media (min-width:1200px){.show-nd{display:none!important}}
.sel{height:34px;border-radius:9px;border:1px solid var(--line2);background:var(--panel2);padding:0 8px}
.menu{position:fixed;z-index:80;background:var(--panel2);border:1px solid var(--line2);border-radius:12px;padding:6px;min-width:220px;box-shadow:0 18px 50px rgba(0,0,0,.5)}
.menu button{display:flex;width:100%;align-items:center;gap:10px;padding:9px 10px;border:0;background:none;border-radius:8px;text-align:left}
.menu button:hover{background:var(--raise)}
.menu hr{border:0;border-top:1px solid var(--line);margin:5px 2px}

/* rail */
#rail{grid-area:rail;display:flex;flex-direction:column;gap:2px;padding:8px 6px;border-right:1px solid var(--line);background:var(--panel);overflow-y:auto}
#rail button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:9px 2px;border:0;border-radius:10px;background:none;color:var(--muted);font-size:10.5px;font-weight:500;line-height:1.1}
#rail button:hover{color:var(--fg);background:var(--panel2)}
#rail button.act{color:var(--dusk);background:rgba(108,92,231,.1)}
#rail button svg{width:20px;height:20px}
#rail .rail-insp{display:none}

/* panel */
#panel{grid-area:panel;border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0;min-width:0}
.sheet-h{display:flex;align-items:center;gap:8px;padding:12px 14px 8px;font:700 15px var(--f-disp)}
.sheet-h .x{display:none}
.sheet-b{overflow-y:auto;padding:4px 14px 18px;min-height:0;flex:1}
.grp{font:600 10.5px var(--f-ui);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:16px 0 8px}
.grp:first-child{margin-top:4px}
.note{color:var(--muted);font-size:12px;line-height:1.5;margin:6px 0}
.drop{border:1.5px dashed var(--line2);border-radius:12px;padding:16px;text-align:center;color:var(--muted);display:grid;gap:10px;justify-items:center}
.drop.hot{border-color:var(--dusk);color:var(--fg)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile{position:relative;border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:0;overflow:hidden;text-align:left;display:flex;flex-direction:column;min-width:0}
.tile:hover{border-color:var(--line2);background:var(--raise)}
.tile.act{border-color:var(--dusk);box-shadow:0 0 0 1px var(--dusk)}
.tile .th{aspect-ratio:16/9;width:100%;background:#0B0C11 center/cover no-repeat;display:block;max-width:100%}
.tile canvas.th{display:block}
.tile .tl{padding:6px 8px;font-size:11.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .tl small{display:block;color:var(--muted);font-weight:400;font-size:10.5px}
.tile .badge{position:absolute;top:5px;left:5px;background:rgba(10,11,16,.75);border-radius:5px;padding:1px 6px;font:600 10px var(--f-mono)}
.tile .rm{position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:6px;border:0;background:rgba(10,11,16,.7);display:none;align-items:center;justify-content:center;padding:0}
.tile:hover .rm{display:flex}
.tile .rm svg{width:13px;height:13px}
.fxi{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--line);background:var(--panel2);border-radius:10px;text-align:left;min-width:0}
.fxi:hover{background:var(--raise);border-color:var(--line2)}
.fxi.act{border-color:var(--dusk)}
.fxi .ico{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;flex:none;background:var(--raise);color:var(--dusk)}
.fxi b{display:block;font-weight:600;font-size:12px}
.fxi span{display:block;color:var(--muted);font-size:10.5px;line-height:1.3}
.fxi > div{min-width:0}
.font-btn{padding:10px 8px;border:1px solid var(--line);background:var(--panel2);border-radius:9px;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
.font-btn:hover{border-color:var(--line2);background:var(--raise)}
.font-btn.act{border-color:var(--dusk);color:var(--dusk)}
.tpl{border:1px solid var(--line);border-radius:10px;padding:0;overflow:hidden;background:var(--panel2);text-align:left}
.tpl:hover{border-color:var(--line2)}
.tpl .pv{height:74px;display:grid;place-items:center;background:linear-gradient(160deg,#3B4C6E,#6F5675 60%,#C9876A);padding:8px;overflow:hidden;text-align:center;line-height:1.05}
.tpl .tl{padding:6px 8px;font-size:11.5px;color:var(--muted)}
.wide{width:100%}
.immo-card{display:grid;grid-template-columns:96px minmax(0,1fr);gap:10px;align-items:center;padding:8px;border:1px solid var(--line);border-radius:12px;background:var(--panel2);text-align:left}
.immo-card:hover{border-color:var(--line2);background:var(--raise)}
.immo-card img,.immo-card canvas{width:96px;aspect-ratio:16/9;border-radius:7px;display:block;background:#0B0C11;object-fit:cover;max-width:100%}
.immo-card b{display:block;font-size:12.5px}
.immo-card span{display:block;color:var(--muted);font-size:11px;line-height:1.35;margin-top:2px}
.stack{display:grid;gap:8px}
.hero-card{border-radius:14px;padding:14px;background:linear-gradient(135deg,rgba(108,92,231,.22),rgba(0,209,255,.10) 60%,rgba(255,110,199,.14));border:1px solid rgba(139,124,255,.45);display:grid;gap:8px}
.hero-card b{font:700 14px var(--f-disp)}

/* stage */
#stage{grid-area:stage;display:flex;flex-direction:column;min-width:0;min-height:0;background:radial-gradient(120% 90% at 50% 20%,#18204A 0%,#0C1226 55%,#090D1A 100%)}
#stageBox{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:14px;position:relative}
#viewport{position:relative;box-shadow:0 20px 60px rgba(0,0,0,.55);background:#000;touch-action:none}
#cv{display:block;width:100%;height:100%}
#selBox{position:absolute;border:1.5px solid var(--dusk);pointer-events:none;transform-origin:center center;display:none}
#selBox .hd{position:absolute;width:14px;height:14px;border-radius:50%;background:var(--dusk);border:2px solid #fff;pointer-events:auto;touch-action:none}
#selBox .hd.sc{right:-8px;bottom:-8px;cursor:nwse-resize}
#selBox .hd.ro{left:50%;top:-30px;margin-left:-7px;cursor:grab}
#selBox .hd.ro::after{content:"";position:absolute;left:4px;top:12px;width:1.5px;height:16px;background:var(--dusk)}
#transport{display:flex;align-items:center;gap:6px;padding:6px 12px 10px;justify-content:center;flex-wrap:wrap}
.tc{font:500 12.5px var(--f-mono);font-variant-numeric:tabular-nums;color:var(--muted);min-width:132px}
.tc b{color:var(--fg);font-weight:600}
#playBtn{width:46px;height:46px;border-radius:50%;background:var(--grad);color:#fff;border:0;box-shadow:0 6px 22px rgba(163,92,240,.4)}
#playBtn:hover{filter:brightness(1.1)}
.tr-right{min-width:132px;display:flex;justify-content:flex-end;gap:4px}

/* inspector */
#insp{grid-area:insp;border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0;min-width:0}
details.sec{border-top:1px solid var(--line);padding:2px 0}
details.sec:first-of-type{border-top:0}
details.sec>summary{list-style:none;display:flex;align-items:center;justify-content:space-between;padding:10px 0;font-weight:600;font-size:12.5px;cursor:pointer}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary::after{content:"";width:7px;height:7px;border-right:1.6px solid var(--muted);border-bottom:1.6px solid var(--muted);transform:rotate(45deg);margin-right:4px;transition:transform .15s}
details.sec[open]>summary::after{transform:rotate(-135deg)}
.row{display:grid;grid-template-columns:96px minmax(0,1fr) 46px;align-items:center;gap:8px;margin:7px 0}
.row label{color:var(--muted);font-size:11.5px}
.row output{font:500 11px var(--f-mono);font-variant-numeric:tabular-nums;color:var(--fg);text-align:right}
.row.r2{grid-template-columns:96px minmax(0,1fr)}
.row input[type=range]{width:100%;accent-color:var(--dusk)}
.row input[type=color]{width:100%;height:28px;border:1px solid var(--line2);border-radius:7px;background:var(--panel2);padding:2px}
.row select,.row input[type=text],.row input[type=number]{width:100%;height:30px;border:1px solid var(--line2);border-radius:7px;background:var(--panel2);padding:0 8px;min-width:0}
textarea.ta,input.ta,select.ta{width:100%;color:var(--fg);font:inherit;outline-offset:2px}
input.ta,select.ta{height:36px;border:1px solid var(--line2);border-radius:9px;background:var(--panel2);padding:0 10px;margin:4px 0 6px}
textarea.ta{width:100%;min-height:72px;border:1px solid var(--line2);border-radius:9px;background:var(--panel2);padding:8px 10px;resize:vertical;margin:4px 0 6px}
.tg{display:inline-flex;align-items:center;gap:8px;cursor:pointer}
.tg input{accent-color:var(--dusk);width:16px;height:16px}
.insp-head{display:flex;align-items:center;gap:8px;padding:12px 14px 6px}
.kind{font:600 10px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;padding:3px 7px;border-radius:5px;background:var(--raise);color:var(--dusk);flex:none}
.insp-head input{flex:1;min-width:0;background:transparent;border:1px solid transparent;border-radius:7px;padding:5px 6px;font-weight:600}
.insp-head input:hover,.insp-head input:focus{border-color:var(--line2);outline:none;background:var(--panel2)}
.chip-row{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.fx-applied{display:grid;grid-template-columns:minmax(0,1fr) 92px 26px;gap:8px;align-items:center;margin:6px 0}
.fx-applied span{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fx-applied input{accent-color:var(--dusk);width:100%}
.mini{width:26px;height:26px;border-radius:7px;border:1px solid var(--line2);background:var(--panel2);display:grid;place-items:center;padding:0}
.mini svg{width:13px;height:13px}
.kbd{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:12px;color:var(--muted)}
.kbd kbd{font:500 11px var(--f-mono);background:var(--raise);border:1px solid var(--line2);border-bottom-width:2px;border-radius:5px;padding:1px 6px;color:var(--fg);justify-self:start}

/* timeline */
#tl{grid-area:tl;display:flex;flex-direction:column;border-top:1px solid var(--line);background:var(--panel);min-height:0;min-width:0}
#tlBar{display:flex;align-items:center;gap:4px;padding:6px 10px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
#tlBar::-webkit-scrollbar{display:none}
#tlBar .div{width:1px;height:22px;background:var(--line2);margin:0 4px;flex:none}
#tlBar input[type=range]{width:110px;accent-color:var(--dusk)}
#tlScroll{flex:1;overflow:auto;position:relative;min-height:0;overscroll-behavior:contain}
#tlGrid{display:flex;min-width:100%;position:relative}
.tl-heads{position:sticky;left:0;z-index:6;background:var(--panel);border-right:1px solid var(--line);flex:none;width:96px}
.tl-corner{position:sticky;top:0;height:26px;background:var(--panel);border-bottom:1px solid var(--line);z-index:7}
.tl-head{display:flex;align-items:center;gap:2px;padding:0 4px 0 8px;border-bottom:1px solid var(--line);font-size:11px;color:var(--muted);overflow:hidden}
.tl-head span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl-head button{width:22px;height:22px;border:0;background:none;color:var(--dim);border-radius:5px;display:grid;place-items:center;padding:0;flex:none}
.tl-head button:hover{color:var(--fg);background:var(--panel2)}
.tl-head button.off{color:var(--danger)}
.tl-head button svg{width:14px;height:14px}
#tlBody{position:relative;flex:none}
#tlRuler{position:sticky;top:0;height:26px;background:var(--panel);border-bottom:1px solid var(--line);z-index:4;cursor:ew-resize;touch-action:none}
.tick{position:absolute;top:0;bottom:0;border-left:1px solid var(--line2);font:500 10px var(--f-mono);color:var(--dim);padding:5px 0 0 4px;white-space:nowrap}
.tick.mi{top:18px;border-color:var(--line)}
.lane{position:relative;border-bottom:1px solid var(--line);background:repeating-linear-gradient(90deg,transparent 0 59px,rgba(255,255,255,.012) 59px 60px)}
.lane.drop-hot{background-color:rgba(108,92,231,.06)}
.clip{position:absolute;top:4px;bottom:4px;border-radius:7px;overflow:hidden;cursor:grab;touch-action:none;background-color:var(--c-main);background-repeat:repeat-x;background-size:auto 100%;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);user-select:none;-webkit-user-select:none}
.clip.k-text{background-color:var(--c-text)} .clip.k-shape{background-color:var(--c-shape)} .clip.k-audio{background-color:var(--c-audio);background-repeat:no-repeat} .clip.k-color{background-color:var(--c-color)}
.lane[data-kind=overlay] .clip.k-video,.lane[data-kind=overlay] .clip.k-image,.lane[data-kind=overlay] .clip.k-scene{background-color:var(--c-ov)}
.clip::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,12,18,.0) 30%,rgba(10,12,18,.55))}
.clip.sel{box-shadow:inset 0 0 0 2px var(--dusk),0 0 0 1px rgba(0,0,0,.4)}
.clip .cn{position:absolute;left:8px;right:8px;bottom:3px;font-size:10.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 2px rgba(0,0,0,.7);pointer-events:none}
.clip .cb{position:absolute;left:6px;top:4px;display:flex;gap:3px;pointer-events:none}
.clip .cb i{font:600 9px var(--f-mono);font-style:normal;background:rgba(10,11,16,.7);padding:1px 4px;border-radius:4px;color:var(--dusk-hi)}
.clip .h{position:absolute;top:0;bottom:0;width:10px;cursor:ew-resize;z-index:2;display:none}
.clip.sel .h{display:block;background:var(--dusk)}
.clip .h::after{content:"";position:absolute;left:4px;top:35%;bottom:35%;width:2px;border-radius:2px;background:var(--dusk-ink)}
.clip .h-l{left:0}.clip .h-r{right:0}
.junc{position:absolute;top:50%;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:6px;border:1.5px solid var(--line2);background:var(--bg);z-index:3;display:grid;place-items:center;padding:0;color:var(--muted)}
.junc.on{border-color:var(--dusk);color:var(--dusk);background:#1E1A3F}
.junc svg{width:12px;height:12px}
#tlPh{position:absolute;top:0;bottom:0;width:0;z-index:5;pointer-events:none}
#tlPh::before{content:"";position:absolute;top:0;bottom:0;left:-1px;width:2px;background:var(--cyan);box-shadow:0 0 8px rgba(0,209,255,.6)}
#tlPh .knob{position:absolute;top:2px;left:-7px;width:14px;height:18px;background:var(--cyan);clip-path:polygon(0 0,100% 0,100% 60%,50% 100%,0 60%)}
.tl-empty{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--dim);font-size:11px;pointer-events:none;white-space:nowrap}

/* modal & toast */
.modal-bg{position:fixed;inset:0;background:rgba(5,6,10,.66);z-index:90;display:grid;place-items:center;padding:16px}
.modal{width:min(560px,100%);max-height:92%;overflow:auto;background:var(--panel);border:1px solid var(--line2);border-radius:16px;padding:20px;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.modal h3{margin:0 0 4px;font:800 20px var(--f-disp)}
.modal .row{grid-template-columns:120px minmax(0,1fr)}
.modal video{width:100%;border-radius:10px;background:#000;margin:10px 0;max-height:46vh}
.prog{height:8px;background:var(--panel2);border-radius:8px;overflow:hidden;margin:12px 0 6px}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--violet),var(--dusk));transition:width .2s}
.mrow{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;margin-top:14px}
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:100;display:grid;gap:8px;justify-items:center;pointer-events:none}
.toast{background:var(--fg);color:#0A0F1E;font-weight:600;padding:9px 16px;border-radius:999px;box-shadow:0 10px 30px rgba(0,0,0,.4);animation:tin .2s ease-out;max-width:90vw;text-align:center}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}
.sheet-shade{display:none}

/* tablet */
@media (max-width:1199px){
  #app{grid-template-columns:var(--railW) 280px minmax(0,1fr);grid-template-areas:"top top top" "rail panel stage" "tl tl tl"}
  #rail .rail-insp{display:flex}
  #insp{position:fixed;top:var(--topH);right:0;bottom:0;width:min(340px,92vw);z-index:40;transform:translateX(105%);transition:transform .22s ease;box-shadow:-20px 0 50px rgba(0,0,0,.45)}
  #insp.open{transform:none}
  #insp .sheet-h .x{display:inline-flex}
  #projName{width:150px}
}
/* phone */
@media (max-width:759px){
  :root{--topH:50px;--tlH:auto}
  #app{grid-template-columns:minmax(0,1fr);grid-template-rows:var(--topH) auto minmax(0,1fr) calc(62px + env(safe-area-inset-bottom,0px));grid-template-areas:"top" "stage" "tl" "rail"}
  #top{gap:6px;padding:0 10px}
  .logo small,#projName,.hide-m{display:none}
  #rail{flex-direction:row;border-right:0;border-top:1px solid var(--line);padding:4px 6px calc(4px + env(safe-area-inset-bottom,0px));overflow-x:auto;overflow-y:hidden;gap:0;scrollbar-width:none}
  #rail::-webkit-scrollbar{display:none}
  #rail button{min-width:62px;flex:none}
  #panel,#insp{position:fixed;left:0;right:0;top:auto;bottom:calc(62px + env(safe-area-inset-bottom,0px));width:auto;max-height:62%;z-index:40;border:1px solid var(--line2);border-bottom:0;border-radius:18px 18px 0 0;transform:translateY(calc(100% + 90px));transition:transform .24s ease;box-shadow:0 -20px 50px rgba(0,0,0,.5)}
  #panel.open,#insp.open{transform:none}
  .sheet-h .x{display:inline-flex}
  .sheet-h::before{content:"";position:absolute;left:50%;top:6px;width:38px;height:4px;margin-left:-19px;border-radius:4px;background:var(--line2)}
  .sheet-h{position:relative;padding-top:16px}
  #stage{height:auto}
  #stageBox{height:min(40vh,56vw + 40px);flex:none;padding:10px}
  #transport{padding:2px 8px 6px}
  .tc,.tr-right{min-width:0}
  .tl-heads{width:58px}
  .tl-head span{display:none}
  #tlBar input[type=range]{width:80px}
  .logo>span:last-child{display:none}
  #aspectSel{max-width:92px;padding:0 4px}
  #toStart,#toEnd{display:none}
  #transport{flex-wrap:nowrap;gap:2px}
  .tc{font-size:11px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ===== v2 additions ===== */
#guides{position:absolute;inset:0;pointer-events:none;z-index:2}
#guides .gd-v{position:absolute;top:0;bottom:0;width:0;border-left:1px dashed rgba(255,255,255,.45)}
#guides .gd-h{position:absolute;left:0;right:0;height:0;border-top:1px dashed rgba(255,255,255,.45)}
#guides .gd-z{position:absolute;background:rgba(226,126,146,.22);border:1px dashed rgba(226,126,146,.8);color:#fff;font:600 10px var(--f-ui);display:flex;align-items:center;justify-content:center;text-align:center;padding:4px}
#guides .gd-s{position:absolute;border:1px dashed rgba(108,92,231,.8)}
#scopes{position:absolute;right:16px;top:16px;z-index:5;background:rgba(17,19,26,.92);border:1px solid var(--line2);border-radius:12px;padding:8px;box-shadow:0 10px 30px rgba(0,0,0,.5);max-width:calc(100% - 32px)}
#scopes .sc-h{display:flex;gap:6px;align-items:center;margin-bottom:6px}
#scopes select{flex:1;height:26px;border-radius:6px;border:1px solid var(--line2);background:var(--panel2);font-size:11.5px}
#scopes canvas{display:block;width:300px;max-width:100%;height:auto;border-radius:6px}
.row.kfrow{grid-template-columns:96px minmax(0,1fr) 42px 24px}
.kfb{width:24px;height:24px;border-radius:6px;border:1px solid transparent;background:none;color:var(--dim);display:grid;place-items:center;padding:0}
.kfb svg{width:13px;height:13px}
.kfb.has{color:var(--muted)}
.kfb.on{color:var(--dusk)}
.kfb.on svg{fill:currentColor}
.kf-nav{align-items:center;justify-content:space-between}
.kf-nav .btn{height:28px;padding:0 8px}
.clip .kfd{position:absolute;bottom:2px;width:7px;height:7px;margin-left:-3.5px;background:var(--dusk);transform:rotate(45deg);border-radius:1px;pointer-events:none;z-index:1}
.mk{position:absolute;top:2px;width:10px;height:14px;margin-left:-5px;border:0;padding:0;background:var(--mc,#6C5CE7);clip-path:polygon(0 0,100% 0,100% 65%,50% 100%,0 65%);cursor:pointer;z-index:2}
.wheels{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:6px 0}
.wheel{display:grid;justify-items:center;gap:4px;min-width:0}
.wheel canvas{width:100%;max-width:104px;aspect-ratio:1;touch-action:none;cursor:crosshair}
.wheel span{font-size:10.5px;color:var(--muted)}
.wheel input{width:100%;accent-color:var(--dusk)}
.pip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:8px 0}
.pip .btn{height:30px;padding:0 6px;font-size:12px}
.chip{border:1px solid var(--line2);border-radius:999px;padding:5px 10px;background:var(--panel2);font-size:12px}
.chip:has(input:checked){border-color:var(--dusk);color:var(--dusk-hi)}
.chip input{width:14px;height:14px}
.wz-goals .wz-card{display:grid;gap:3px;border:1px solid var(--line);background:var(--panel2);border-radius:12px;padding:10px;cursor:pointer;position:relative}
.wz-card input{position:absolute;opacity:0;pointer-events:none}
.wz-card:has(input:checked){border-color:var(--dusk);box-shadow:0 0 0 1px var(--dusk)}
.wz-card b{font-size:12.5px}.wz-card span{font-size:11px;color:var(--muted);line-height:1.35}
.wz-form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 10px}
.wz-form label{display:grid;gap:3px;font-size:11px;color:var(--muted);min-width:0}
.wz-form input{height:32px;border:1px solid var(--line2);border-radius:7px;background:var(--panel2);padding:0 8px;color:var(--fg);min-width:0;width:100%}
.wz-form input[type=color]{padding:2px}
.modal{width:min(640px,100%)}
.model{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);text-decoration:none;color:var(--fg)}
.model:hover{border-color:var(--line2)}
.model>div{min-width:0}
.model b{display:block;font-size:12px}.model span{display:block;font-size:11px;color:var(--muted)}.model small{display:block;font:500 10px var(--f-mono);color:var(--dim);margin-top:3px;overflow-wrap:anywhere}
.where{font:600 9.5px var(--f-mono);font-style:normal;text-transform:uppercase;letter-spacing:.05em;padding:2px 6px;border-radius:5px;white-space:nowrap;flex:none;margin-left:auto}
.where.nav{background:rgba(79,185,161,.15);color:var(--teal)}.where.srv{background:rgba(157,141,244,.15);color:var(--violet)}
.fxi .where{align-self:flex-start}
.fxi.dis{opacity:.55}
.ai-pill{position:fixed;left:50%;transform:translateX(-50%);top:calc(60px + env(safe-area-inset-top,0px));z-index:95;background:var(--violet);color:#14121F;font-weight:700;padding:7px 14px;border-radius:999px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.ex-row{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.ex-row b{flex:1;min-width:140px}.ex-row span{color:var(--muted);font-size:12px}
.linkb{border:0;background:none;color:var(--dusk);padding:0;font:600 11px var(--f-mono)}
code{font:500 11px var(--f-mono);background:var(--raise);padding:1px 5px;border-radius:4px}
@media (max-width:759px){.wz-form{grid-template-columns:minmax(0,1fr)}#scopes{right:8px;top:8px}#scopes canvas{width:220px}.wheels{gap:2px}}
</style>

/* keyframes: c.kf[prop] = [{t (local s), v, e:'ease'|'linear'|'hold'}] sorted by t */
function kv(c,prop,lt){
  const ks=c.kf&&c.kf[prop];if(!ks||!ks.length)return c[prop];
  if(lt<=ks[0].t)return ks[0].v;const last=ks[ks.length-1];if(lt>=last.t)return last.v;
  for(let i=0;i<ks.length-1;i++){const a=ks[i],b=ks[i+1];if(lt>=a.t&&lt<=b.t){if(a.e==='hold')return a.v;let p=(lt-a.t)/Math.max(1e-6,b.t-a.t);if(a.e!=='linear')p=ease.inOut(p);return a.v+(b.v-a.v)*p}}
  return c[prop];
}
const hasKf=(c,prop)=>!!(c.kf&&c.kf[prop]&&c.kf[prop].length);
function kfAt(c,prop,lt){const ks=c.kf&&c.kf[prop];return ks?ks.findIndex(k=>Math.abs(k.t-lt)<1/60):-1}
function setKf(c,prop,lt,v){c.kf=c.kf||{};const ks=c.kf[prop]||(c.kf[prop]=[]);const i=kfAt(c,prop,lt);if(i>=0)ks[i].v=v;else{ks.push({t:+lt.toFixed(3),v,e:'ease'});ks.sort((a,b)=>a.t-b.t)}}
function kfTimes(c){const s=new Set();for(const p in (c.kf||{}))(c.kf[p]||[]).forEach(k=>s.add(+k.t.toFixed(3)));return [...s].sort((a,b)=>a-b)}
function setProp(c,prop,v){if(hasKf(c,prop))setKf(c,prop,clamp(S.t-c.start,0,c.dur),v);else c[prop]=v}

/* ---------- WebGL colour engine ---------- */
/* One fragment shader does: parallax 2.5D (depth), blur, RGB split, HDR, sky/window masks (Jour→Nuit, ciel, fenêtres),

const FRAG=`#ifdef GL_FRAGMENT_PRECISION_HIGH
precision highp float;
#else
precision mediump float;
#endif
varying vec2 v;uniform sampler2D u_t,u_lutT,u_depT;uniform vec2 u_px;uniform float u_time;
uniform float u_bright,u_contrast,u_sat,u_temp,u_tint,u_hue,u_fade,u_vig,u_grain,u_blur,u_rgb,u_scan,u_mirror,u_split;

function compose(g,type,A,B,p,W,H,al=1){
  g.save();const e=ease.inOut(p);
  const dA=(x=0,y=0,a=1)=>{if(A){g.globalAlpha=a;g.drawImage(A,x,y)}};
  const dB=(x=0,y=0,a=1)=>{g.globalAlpha=a*al;g.drawImage(B,x,y)};
  const scaled=(cv2,s,a,r=0,isB=false)=>{if(!cv2)return;g.save();g.globalAlpha=a*(isB?al:1);g.translate(W/2,H/2);g.rotate(r);g.scale(s,s);g.drawImage(cv2,-W/2,-H/2);g.restore()};
  switch(type){
    case'fade':dA();dB(0,0,e);break;
    case'black':case'white':{const col=type==='black'?'#000':'#fff';if(A){if(p<.5){dA();g.globalAlpha=e*2>1?1:p*2;g.fillStyle=col;g.fillRect(0,0,W,H)}else{dB();g.globalAlpha=(1-p)*2;g.fillStyle=col;g.fillRect(0,0,W,H)}}else{g.fillStyle=col;g.globalAlpha=1-e;g.fillRect(0,0,W,H);dB(0,0,e)}break}
    case'slide-l':dA();dB(W*(1-e),0);break;case'slide-r':dA();dB(-W*(1-e),0);break;case'slide-u':dA();dB(0,H*(1-e));break;
    case'push-l':dA(-W*e,0);dB(W*(1-e),0);break;
    case'wipe-l':dA();g.beginPath();g.rect(W*(1-e),0,W*e+1,H);g.clip();dB();break;
    case'wipe-d':dA();g.beginPath();g.rect(0,0,W,H*e+1);g.clip();dB();break;
    case'zoom-in':dA();scaled(B,.55+.45*e,e,0,true);break;
    case'zoom-out':dB();scaled(A,1+e*.6,1-e);break;
    case'dive':scaled(A,1+e*1.8,1-ease.in(p));scaled(B,.82+.18*e,ease.out(p),0,true);break;
    case'circle':{dA();g.beginPath();g.arc(W/2,H/2,Math.hypot(W,H)/2*e+1,0,7);g.clip();dB();break}
    case'diamond':{dA();const r=(W+H)*.55*e;g.beginPath();g.moveTo(W/2,H/2-r);g.lineTo(W/2+r,H/2);g.lineTo(W/2,H/2+r);g.lineTo(W/2-r,H/2);g.closePath();g.clip();dB();break}
    case'blinds':{dA();const n=8,sw=W/n;g.beginPath();for(let i=0;i<n;i++)g.rect(i*sw,0,sw*e+.5,H);g.clip();dB();break}
    case'doors':{dB();if(A){g.save();g.beginPath();g.rect(0,0,W/2,H);g.clip();g.drawImage(A,-W/2*e,0);g.restore();g.save();g.beginPath();g.rect(W/2,0,W/2,H);g.clip();g.drawImage(A,W/2*e,0);g.restore();g.globalAlpha=.35*(1-Math.abs(p-.5)*2);g.fillStyle='#000';g.fillRect(W/2-W/2*e-3,0,6,H);g.fillRect(W/2+W/2*e-3,0,6,H)}break}
    case'curtain':dB();if(A)dA(0,-H*e);break;
    case'blur':{if(hasFilter){if(A){g.filter=`blur(${(e*24*W/1920).toFixed(1)}px)`;dA(0,0,1)}g.filter=`blur(${((1-e)*24*W/1920).toFixed(1)}px)`;dB(0,0,e);g.filter='none'}else{dA();dB(0,0,e)}break}
    case'whip':{const b=Math.sin(p*Math.PI)*36*W/1920;if(hasFilter)g.filter=`blur(${b.toFixed(1)}px)`;dA(-W*e,0);dB(W*(1-e),0);g.filter='none';break}
    case'spin':dA();scaled(B,e,e,(1-e)*-Math.PI,true);break;
    case'glitch':{const src=p<.5?A:B;if(!src){dB(0,0,e);break}const amp=Math.sin(p*Math.PI)*W*.06,seed=Math.floor(p*30);for(let i=0;i<16;i++){const y=i*H/16,h=H/16+1,dx=(rnd(seed*17+i)-.5)*amp*2;g.globalAlpha=src===B?al:1;g.drawImage(src,0,y,W,h,dx,y,W,h)}break}
    case'burn':{dA();dB(0,0,e);g.globalCompositeOperation='screen';const k=Math.sin(p*Math.PI);const gr=g.createRadialGradient(W*(.3+.4*p),H*.5,0,W*(.3+.4*p),H*.5,Math.max(W,H)*.8);gr.addColorStop(0,`rgba(255,200,120,${k})`);gr.addColorStop(.5,`rgba(255,90,40,${k*.6})`);gr.addColorStop(1,'rgba(120,20,0,0)');g.globalAlpha=1;g.fillStyle=gr;g.fillRect(0,0,W,H);break}
    case'flash':dA();dB(0,0,e);g.globalAlpha=Math.sin(p*Math.PI);g.fillStyle='#fff';g.fillRect(0,0,W,H);break;
    default:dB();
  }
  g.restore();
}

/* ===== 11-frame-renderer.js ===== */
/* ---------- frame renderer ---------- */
function renderFrame(t){
  const W=cv.width,H=cv.height,u=Math.min(W,H)/1080;ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';ctx.filter='none';
  ctx.fillStyle=P.bg;ctx.fillRect(0,0,W,H);
  for(const k in bounds)delete bounds[k];
  const order=P.tracks.filter(tr=>tr.kind!=='audio'&&!tr.hidden).slice().reverse();
  for(const tr of order){
    const cs=P.clips.filter(c=>c.trackId===tr.id).sort((a,b)=>a.start-b.start);
    for(const c of cs){
      const lt=t-c.start;if(lt<0||lt>=c.dur)continue;
      let al=clamp(kv(c,'opacity',lt));if(c.fadeOut>0)al*=clamp((c.dur-lt)/c.fadeOut);
      if(c.kind==='adjust'){
        if(GLX){const p=clipParams(c,lt),ex=glExtras(c);if(needsGL(p,ex)){try{const img=GLX.run(cv,W,H,p,t,ex);ctx.globalAlpha=al;ctx.drawImage(img,0,0);ctx.globalAlpha=1}catch(e){}}}
        ctx.save();ctx.globalAlpha=al;fxOverlay(ctx,c,lt,W,H,u);ctx.restore();continue;
      }
      const tt=c.trans;const inT=tt&&tt.type!=='none'&&lt<tt.dur;
      if(inT){
        const prev=cs.find(o=>o!==c&&o.kind!=='adjust'&&Math.abs(o.start+o.dur-c.start)<.02);
        L1.getContext('2d').clearRect(0,0,W,H);L2.getContext('2d').clearRect(0,0,W,H);
        if(prev)renderClip(prev,t,L1);renderClip(c,t,L2);
        compose(ctx,tt.type,prev?L1:null,L2,clamp(lt/tt.dur),W,H,al);
      }else{
        const g1=L1.getContext('2d');g1.clearRect(0,0,W,H);renderClip(c,t,L1);
        ctx.globalAlpha=al;ctx.globalCompositeOperation=c.blend||'source-over';ctx.drawImage(L1,0,0);ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
      }
    }
  }
}

function fitViewport(){

  viewport.style.width=Math.floor(bw*k)+'px';viewport.style.height=Math.floor(bh*k)+'px';
}
new ResizeObserver(()=>{fitViewport();req()}).observe(stageBox);
function updateSelBox(){
  const c=selClip(),b=c&&bounds[c.id];
  if(!b||S.exporting||!isVisual(c)||c.kind==='color'){selBox.style.display='none';return}
  const k=viewport.clientWidth/cv.width;

  selBox.style.left=(b.cx*k-b.w*k/2)+'px';selBox.style.top=(b.cy*k-b.h*k/2)+'px';selBox.style.transform=`rotate(${b.rot}rad)`;

function hitTest(px,py){
  const order=P.tracks.filter(tr=>tr.kind!=='audio'&&!tr.hidden);
  for(const tr of order){const cs=P.clips.filter(c=>c.trackId===tr.id&&S.t>=c.start&&S.t<c.start+c.dur&&c.kind!=='color');
    for(const c of cs.reverse()){const b=bounds[c.id];if(!b)continue;const dx=px-b.cx,dy=py-b.cy,co=Math.cos(-b.rot),si=Math.sin(-b.rot);const lx=dx*co-dy*si,ly=dx*si+dy*co;if(Math.abs(lx)<=b.w/2&&Math.abs(ly)<=b.h/2)return c}}
  return null;
}
viewport.addEventListener('pointerdown',e=>{
  const r=cv.getBoundingClientRect(),k=cv.width/r.width;const px=(e.clientX-r.left)*k,py=(e.clientY-r.top)*k;
  const h=e.target.dataset&&e.target.dataset.h;let c=h?selClip():hitTest(px,py);

  pause();
  const b=bounds[c.id]||{cx:c.x*cv.width,cy:c.y*cv.height};const lt0=S.t-c.start;const st={x:kv(c,'x',lt0),y:kv(c,'y',lt0),scale:kv(c,'scale',lt0),rot:kv(c,'rot',lt0),px,py,d0:Math.hypot(px-b.cx,py-b.cy)||1,a0:Math.atan2(py-b.cy,px-b.cx)};
  let moved=false;
  const mv=ev=>{const qx=(ev.clientX-r.left)*k,qy=(ev.clientY-r.top)*k;
    if(!moved&&Math.hypot(qx-px,qy-py)<3)return;moved=true;
    if(h==='sc'){setProp(c,'scale',clamp(st.scale*Math.hypot(qx-b.cx,qy-b.cy)/st.d0,.05,8))}
    else if(h==='ro'){let a=st.rot+(Math.atan2(qy-b.cy,qx-b.cx)-st.a0)*180/Math.PI;for(const s of [-180,-90,0,90,180])if(Math.abs(a-s)<4)a=s;setProp(c,'rot',Math.round(((a+540)%360)-180))}
    else{let nx=st.x+(qx-px)/cv.width,ny=st.y+(qy-py)/cv.height;if(Math.abs(nx-.5)<.01)nx=.5;if(Math.abs(ny-.5)<.01)ny=.5;setProp(c,'x',nx);setProp(c,'y',ny)}
    req();};
  const up=()=>{window.removeEventListener('pointermove',mv);window.removeEventListener('pointerup',up);window.removeEventListener('pointercancel',up);if(moved){commit();renderInspector()}};
  window.addEventListener('pointermove',mv);window.addEventListener('pointerup',up);window.addEventListener('pointercancel',up);
  e.preventDefault();
});

/* ---------- playback ---------- */
let lastNow=0,scopeTick=0;
function play(){if(S.playing)return;ensureAudio();if(S.t>=projDur()-.02)S.t=0;S.playing=true;lastNow=performance.now();updateTransport()}
function pause(){S.rate=1;if(!S.playing)return;S.playing=false;pauseAll();updateTransport();req()}
function togglePlay(){S.playing?pause():play()}
function setTime(t){S.t=clamp(t,0,projDur());if(S.playing){syncMedia(S.t,true)}req();inspFollow()}
function tick(now){
  if(S.playing){const dt=Math.min(.1,(now-lastNow)/1000);lastNow=now;S.t+=dt*(S.exporting?1:(S.rate||1));const d=projDur();
    if(S.t>=d){if(S.exporting){S.t=d;finishExport()}else if(S.loop){S.t=0;pauseAll()}else{S.t=d;pause()}}
    syncMedia(S.t,S.playing);dirty=true}
  if(dirty){dirty=false;if(!S.playing)syncMedia(S.t,false);renderFrame(S.t);updateSelBox();updateClock()}
  if(S.tab==='trans'&&transPreviews.length)drawTransPreviews(now);
  if(S.scopes&&(++scopeTick%6===0))drawScopes();
  requestAnimationFrame(tick);
}
function updateClock(){
  $('#tc').innerHTML=`<b>${fmtT(S.t)}</b> / ${fmtT(projDur())}`;
  const ph=$('#tlPh');if(ph){ph.style.left=(S.t*S.pps)+'px';
    if(S.playing){const sc=$('#tlScroll'),x=S.t*S.pps+96;if(x>sc.scrollLeft+sc.clientWidth-60||x<sc.scrollLeft+96)sc.scrollLeft=x-140}}
}
function updateTransport(){$('#playBtn').innerHTML=ic(S.playing?'pause':'play','f');$('#playBtn').setAttribute('aria-label',S.playing?'Pause':'Lecture')}

/* ---------- history & persistence ---------- */
const hist={stack:[],i:-1};
function snap(){return JSON.stringify({tracks:P.tracks,clips:P.clips,aspect:P.aspect,bg:P.bg,name:P.name})}
function commit(){const s=snap();if(hist.stack[hist.i]===s)return;hist.stack=hist.stack.slice(0,hist.i+1);hist.stack.push(s);if(hist.stack.length>150)hist.stack.shift();hist.i=hist.stack.length-1;updUndo();saveSoon()}
function restore(s){const o=JSON.parse(s);const asp=P.aspect;Object.assign(P,o);if(S.sel&&!clipById(S.sel))S.sel=null;pauseAll();if(asp!==P.aspect){$('#aspectSel').value=P.aspect;setRes(S.pq)}refreshAll();saveSoon()}
function undo(){if(hist.i>0){hist.i--;restore(hist.stack[hist.i]);updUndo()}}
function redo(){if(hist.i<hist.stack.length-1){hist.i++;restore(hist.stack[hist.i]);updUndo()}}
function updUndo(){$('#undoBtn').disabled=hist.i<=0;$('#redoBtn').disabled=hist.i>=hist.stack.length-1}
const LS_KEY='topclap-v1';let saveT=0;
function saveSoon(){clearTimeout(saveT);saveT=setTimeout(()=>{try{localStorage.setItem(LS_KEY,JSON.stringify({P,S:{pps:S.pps,magnet:S.magnet,snap:S.snap},media:Object.values(media).map(m=>({id:m.id,type:m.type,name:m.name,demo:m.demo||null}))}))}catch(e){}},500)}
const IDB={db:null,
  open(){return new Promise(res=>{try{const r=indexedDB.open('topclap-media',1);r.onupgradeneeded=()=>r.result.createObjectStore('files');r.onsuccess=()=>{this.db=r.result;res(this.db)};r.onerror=()=>res(null)}catch(e){res(null)}})},
  async put(id,blob){try{const db=this.db||await this.open();if(!db)return;db.transaction('files','readwrite').objectStore('files').put(blob,id)}catch(e){}},
  async get(id){try{const db=this.db||await this.open();if(!db)return null;return await new Promise(res=>{const r=db.transaction('files').objectStore('files').get(id);r.onsuccess=()=>res(r.result||null);r.onerror=()=>res(null)})}catch(e){return null}},
  async del(id){try{const db=this.db||await this.open();if(!db)return;db.transaction('files','readwrite').objectStore('files').delete(id)}catch(e){}}
};

/* ===== 15-media-import.js ===== */
/* ---------- media import ---------- */
const once=(el,ev,ms=8000)=>new Promise(res=>{let done=false;const f=()=>{if(!done){done=true;res()}};el.addEventListener(ev,f,{once:true});el.addEventListener('error',f,{once:true});setTimeout(f,ms)});
async function registerMedia(id,blob,meta){
  if(meta.type==='lut'){try{const {n,data}=parseCube(await blob.text());LUTS[id]={id,name:meta.name,n,data};media[id]={...meta,id,blob}}catch(e){}return media[id]}
  const url=URL.createObjectURL(blob);const m={...meta,id,url,blob};media[id]=m;
  if(m.type==='image'){const img=new Image();img.src=url;try{await img.decode()}catch(e){await once(img,'load')}m.el=img;m.w=img.naturalWidth;m.h=img.naturalHeight;m.thumb=thumbOf(img).toDataURL('image/jpeg',.8)}
  else if(m.type==='video'){const v=document.createElement('video');v.muted=true;v.preload='auto';v.playsInline=true;v.src=url;await once(v,'loadeddata');
    if(!isFinite(v.duration)){v.currentTime=1e7;await once(v,'seeked',3000);v.currentTime=0;await once(v,'seeked',3000)}
    m.dur=isFinite(v.duration)?v.duration:10;m.w=v.videoWidth;m.h=v.videoHeight;m.thumb=thumbOf(v).toDataURL('image/jpeg',.75);genStrip(m,v)}
  else if(m.type==='audio'){const a=document.createElement('audio');a.preload='metadata';a.src=url;await once(a,'loadedmetadata');m.dur=isFinite(a.duration)?a.duration:30;
    try{const buf=await blob.arrayBuffer();const oc=new (window.OfflineAudioContext||window.webkitOfflineAudioContext)(1,44100,44100);const ab=await oc.decodeAudioData(buf);m.dur=ab.duration;m.wave=waveImg(ab.getChannelData(0))}catch(e){}}
  renderPanelIf('media','audio');return m;
}
async function genStrip(m,v){
  const n=10,fw=96,fh=54;const c=document.createElement('canvas');c.width=n*fw;c.height=fh;const g=c.getContext('2d');
  for(let i=0;i<n;i++){v.currentTime=Math.min(m.dur-.05,(i+.5)/n*m.dur);await once(v,'seeked',2500);try{const r=Math.max(fw/v.videoWidth,fh/v.videoHeight);g.drawImage(v,i*fw+(fw-v.videoWidth*r)/2,(fh-v.videoHeight*r)/2,v.videoWidth*r,v.videoHeight*r)}catch(e){}}
  m.strip=c.toDataURL('image/jpeg',.7);renderTimeline();
}
function waveImg(data){const n=600,c=document.createElement('canvas');c.width=n;c.height=48;const g=c.getContext('2d');const step=Math.max(1,Math.floor(data.length/n));g.fillStyle='rgba(200,255,235,.75)';
  let mx=0.0001;const pk=[];for(let i=0;i<n;i++){let p=0;for(let j=i*step;j<(i+1)*step&&j<data.length;j+=4)p=Math.max(p,Math.abs(data[j]));pk.push(p);mx=Math.max(mx,p)}
  pk.forEach((p,i)=>{const h=Math.max(1,p/mx*44);g.fillRect(i,24-h/2,1,h)});return c.toDataURL()}
function kindOfFile(f){const t=f.type||'',n=f.name.toLowerCase();if(t.startsWith('video')||/\.(mp4|webm|mov|m4v|mkv)$/.test(n))return'video';if(t.startsWith('image')||/\.(png|jpe?g|webp|gif|avif|bmp)$/.test(n))return'image';if(t.startsWith('audio')||/\.(mp3|wav|ogg|m4a|aac|flac)$/.test(n))return'audio';if(/\.(srt|vtt)$/.test(n))return'srt';if(/\.cube$/.test(n))return'lut';if(/\.json$/.test(n))return'project';return null}
async function importFiles(files){
  let added=0;
  for(const f of files){const k=kindOfFile(f);
    if(k==='srt'){importSRT(await f.text(),S.capStyle||'karaoke');continue}
    if(k==='lut'){await importLUTFile(f);continue}
    if(k==='project'){openProjectText(await f.text());continue}
    if(!k){toast(`Format non pris en charge : ${f.name}`);continue}
    const id=uid();toast(`Import de ${f.name}…`);
    const m=await registerMedia(id,f,{type:k,name:f.name});IDB.put(id,f);addMediaToTimeline(m,false);added++;
  }
  if(added){commit();refreshAll();toast(added>1?`${added} médias ajoutés à la timeline`:'Média ajouté à la timeline')}
}

/* ===== 16-demo-music-synthesised-royalty.js ===== */
/* ---------- demo music (synthesised, royalty-free) ---------- */
function synthMusic(kind){
  const sr=22050,dur=32,n=sr*dur,d=new Float32Array(n);const f=m=>440*Math.pow(2,(m-69)/12);
  const ch=kind==='pulse'?[[57,60,64],[53,57,60],[48,52,55],[55,59,62]]:[[57,60,64,67],[53,57,60,64],[48,52,55,59],[55,59,62,65]];
  const bar=kind==='pulse'?2.4:4,beat=60/100;
  for(let i=0;i<n;i++){const t=i/sr,ci=Math.floor(t/bar)%4,lt=t%bar,env=Math.min(1,lt/.7)*Math.min(1,(bar-lt)/.5);let s=0;
    for(const m of ch[ci]){const fr=f(m);s+=Math.sin(6.2832*fr*t)*.5+Math.sin(6.2832*fr*2.003*t)*.1}
    s*=env*.085;s+=Math.sin(6.2832*f(ch[ci][0]-12)*t)*.13*env;
    if(kind==='pulse'){const bt=t%beat;s+=Math.sin(6.2832*(48+90*Math.exp(-bt*30))*bt)*Math.exp(-bt*9)*.55;const ht=(t+beat/2)%beat;s+=(rnd(i)*2-1)*Math.exp(-ht*70)*.09}
    else{const step=bar/8,k=Math.floor(lt/step),at=lt%step,m=ch[ci][k%ch[ci].length]+12;s+=Math.sin(6.2832*f(m)*t)*Math.exp(-at*3.2)*.07}
    d[i]=s*Math.min(1,t/1.5)*Math.min(1,(dur-t)/2.5)}
  let mx=0;for(let i=0;i<n;i++)mx=Math.max(mx,Math.abs(d[i]));for(let i=0;i<n;i++)d[i]=d[i]/mx*.8;
  const buf=new ArrayBuffer(44+n*2),dv=new DataView(buf);const ws=(o,s)=>{for(let i=0;i<s.length;i++)dv.setUint8(o+i,s.charCodeAt(i))};
  ws(0,'RIFF');dv.setUint32(4,36+n*2,true);ws(8,'WAVE');ws(12,'fmt ');dv.setUint32(16,16,true);dv.setUint16(20,1,true);dv.setUint16(22,1,true);dv.setUint32(24,sr,true);dv.setUint32(28,sr*2,true);dv.setUint16(32,2,true);dv.setUint16(34,16,true);ws(36,'data');dv.setUint32(40,n*2,true);
  for(let i=0;i<n;i++)dv.setInt16(44+i*2,clamp(d[i],-1,1)*32767,true);
  return {blob:new Blob([buf],{type:'audio/wav'}),data:d,dur};
}

    c.trackId=Tm.id;c.start=t;t+=c.dur;P.clips.push(c)});
  const total=t;
  const T=(tpl,start,dur,extra={})=>{const p=TEXT_TPL.find(x=>x.name===tpl).p;const c=newClip('text',{...p,start,dur,trackId:Tt.id,...extra});c.name=c.text.split('\n')[0].slice(0,28);P.clips.push(c)};
  T('Titre élégant',.4,Math.min(3.6,total*.25),{animOut:'fade',text:P.name+'\nVotre nouvelle adresse'});
  if(total>8)T('Prix',total*.3,Math.min(3.6,total*.2));
  if(total>12)T('Caractéristiques',total*.55,Math.min(3.8,total*.2));

  const nv=newClip('text',{...TEXT_TPL.find(x=>x.name==='Nouveauté').p,start:.6,dur:Math.min(4,total*.3),trackId:To.id,name:'Nouveauté'});P.clips.push(nv);

}

/* ===== 19-srt.js ===== */
/* ---------- SRT / VTT ---------- */
function parseSubs(txt){
  const ts=s=>{const m=s.match(/(?:(\d+):)?(\d+):(\d+)[,.](\d+)/);return m?(+(m[1]||0))*3600+ +m[2]*60+ +m[3]+ +m[4]/1000:0};
  const cues=[];for(const b of txt.replace(/\r/g,'').split(/\n\n+/)){const lines=b.split('\n').filter(Boolean);const i=lines.findIndex(l=>l.includes('-->'));if(i<0)continue;const [a,z]=lines[i].split('-->');const text=lines.slice(i+1).join(' ').replace(/<[^>]+>/g,'').trim();if(text)cues.push({s:ts(a),e:ts(z),text})}
  return cues;
}
function importSRT(txt,style='karaoke'){
  const cues=parseSubs(txt);if(!cues.length){toast('Aucun sous-titre trouvé dans ce fichier');return}
  const words=cues.flatMap(q=>wordsFromText(q.text,q.s,Math.max(q.s+.2,q.e)));
  addCaptionClip(words,'Sous-titres importés',style);commit();refreshAll();toast(`${cues.length} sous-titres importés (${words.length} mots animés)`);
}
function captionsToSRT(c){
  const gs=captionGroups(c);const f=t=>{t=Math.max(0,t);const h=Math.floor(t/3600),m=Math.floor(t%3600/60),s=Math.floor(t%60),ms=Math.round((t%1)*1000);return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')},${String(ms).padStart(3,'0')}`};
  return gs.map((g,i)=>`${i+1}\n${f(c.start+c.words[g[0]].s)} --> ${f(c.start+c.words[g[g.length-1]].e)}\n${g.map(k=>c.words[k].w).join(' ')}\n`).join('\n');
}

const thumbCache={};
const SMALL={};for(const k in SCN){const c=document.createElement('canvas');c.width=320;c.height=180;c.getContext('2d').drawImage(SCN[k],0,0,320,180);SMALL[k]=c}
function filterThumb(k){if(thumbCache['f'+k])return thumbCache['f'+k];const p=baseParams();addPreset(p,k,1);thumbCache['f'+k]=engineThumb(SMALL.villa,p);return thumbCache['f'+k]}
function immoThumb(m){if(thumbCache['i'+m.name])return thumbCache['i'+m.name];const p=baseParams();Object.assign(p,m.p||{});if(m.p&&m.p.preset)addPreset(p,m.p.preset,1);thumbCache['i'+m.name]=engineThumb(SMALL[m.scene||'villa'],p,m.post);return thumbCache['i'+m.name]}
function engineThumb(src,p,post){const c=document.createElement('canvas');c.width=192;c.height=108;const g=c.getContext('2d');let img=src;if(GLX&&needsGL(p)){try{img=GLX.run(src,320,180,p,1)}catch(e){}}g.drawImage(img,0,0,192,108);if(post)post(g,192,108);return c.toDataURL('image/jpeg',.85)}

const TPA=document.createElement('canvas'),TPB=document.createElement('canvas');TPA.width=TPB.width=160;TPA.height=TPB.height=90;
TPA.getContext('2d').drawImage(SCN.villa,0,0,160,90);TPB.getContext('2d').drawImage(SCN.salon,0,0,160,90);
function drawTransPreviews(now){const p=((now/1000)%2.2)/1.6;const pp=clamp(p);for(const cn of transPreviews){const g=cn.getContext('2d');g.setTransform(1,0,0,1,0,0);g.globalAlpha=1;g.filter='none';g.globalCompositeOperation='source-over';g.fillStyle='#000';g.fillRect(0,0,160,90);if(cn.dataset.tp==='none'){g.drawImage(pp<.5?TPA:TPB,0,0)}else compose(g,cn.dataset.tp,TPA,TPB,pp,160,90,1)}}

const inspBody=$('#inspBody');
const R=(id,label,v,min,max,step,fmt,kf)=>`<div class="row${kf?' kfrow':''}"><label for="${id}">${label}</label><input type="range" id="${id}" min="${min}" max="${max}" step="${step}" value="${v}"><output data-fmt="${fmt||''}">${fmtV(v,fmt)}</output>${kf?kf:''}</div>`;

const COL=(id,label,v)=>`<div class="row r2"><label for="${id}">${label}</label><input type="color" id="${id}" value="${toHex(v)}"></div>`;
const TXT=(id,label,v)=>`<div class="row r2"><label for="${id}">${label}</label><input type="text" id="${id}" value="${esc(v||'')}"></div>`;
const TG=(id,label,v)=>`<label class="tg" style="margin:6px 0"><input type="checkbox" id="${id}" ${v?'checked':''}>${label}</label>`;
const sec=(title,body,open=true,id='')=>`<details class="sec" ${open?'open':''} ${id?`data-sec="${id}"`:''}><summary>${title}</summary>${body}</details>`;
const openSecs=new Set(['Temps','Texte','Sous-titres','Transformation','Forme','Fond','Audio']);

      ${SEL('b_logo','Logo',B.logo||'',[['','Aucun'],...Object.values(media).filter(m=>m.type==='image').map(m=>[m.id,m.name])])}`,false);
    h+=sec(`Marqueurs (${(P.markers||[]).length})`,`${(P.markers||[]).length?(P.markers.slice(0,40).map((m,i)=>`<div class="fx-applied"><span><button class="linkb" data-goto="${m.t}">${fmtT(m.t)}</button> ${esc(m.label||'')}</span><span></span><button class="mini" data-mkdel="${i}" aria-label="Supprimer le marqueur">${ic('x')}</button></div>`).join('')):'<p class="note">Touche M pour poser un marqueur à la tête de lecture.</p>'}<button class="btn wide" data-ia="mkadd">${ic('flag')}Ajouter un marqueur</button>`,false);
    h+=sec('Raccourcis clavier',`<div class="kbd"><kbd>Espace</kbd><span>Lecture / pause</span><kbd>J K L</kbd><span>Arrière / pause / avant (×2 en répétant)</span><kbd>S</kbd><span>Couper à la tête de lecture</span><kbd>M</kbd><span>Marqueur</span><kbd>Suppr</kbd><span>Supprimer le clip</span><kbd>Ctrl D</kbd><span>Dupliquer</span><kbd>Ctrl Z</kbd><span>Annuler</span><kbd>Ctrl Maj Z</kbd><span>Rétablir</span><kbd>← →</kbd><span>Image par image (Maj : 1 s)</span><kbd>Ctrl molette</kbd><span>Zoom timeline</span></div>`,false);
    h+=sec('À propos',`<p class="note">Top Clap est un logiciel libre (licence MIT). Le montage, les effets et l'export se font dans votre navigateur : vos fichiers ne quittent pas votre appareil.</p>`,false);
    inspBody.innerHTML=h;return;
  }
  const lt=clamp(S.t-c.start,0,c.dur);
  const kindL={video:'Vidéo',image:'Photo',scene:'Scène',text:'Texte',caption:'Sous-titres',shape:'Forme',color:'Fond',audio:'Audio',adjust:'Réglage'}[c.kind];

  if(isVisual(c)&&c.kind!=='adjust'){
    let tf=`${R('k_x','Position X',kv(c,'x',lt),-.5,1.5,.001,'%',KB('x'))}${R('k_y','Position Y',kv(c,'y',lt),-.5,1.5,.001,'%',KB('y'))}${R('k_scale','Échelle',kv(c,'scale',lt),.05,4,.01,'%',KB('scale'))}${R('k_rot','Rotation',kv(c,'rot',lt),-180,180,1,'°',KB('rot'))}${R('k_opacity','Opacité',kv(c,'opacity',lt),0,1,.01,'%',KB('opacity'))}`;
    const nk=kfTimes(c).length;tf+=`<div class="chip-row kf-nav"><button class="btn" data-ia="kfprev" aria-label="Image clé précédente">${ic('stepB')}</button><span class="note" style="margin:0">${nk?nk+' image(s) clé':'◆ pour animer'}</span><button class="btn" data-ia="kfnext" aria-label="Image clé suivante">${ic('stepF')}</button>${nk?`<button class="btn" data-ia="kfclear">Effacer</button>`:''}</div>`;

/* ===== LUT 3D (.cube) ===== */
function cubeToData(n,get){const data=new Uint8Array(n*n*n*4);for(let b=0;b<n;b++)for(let g=0;g<n;g++)for(let r=0;r<n;r++){const o=get(r/(n-1),g/(n-1),b/(n-1),r+g*n+b*n*n);const i=(g*(n*n)+b*n+r)*4;data[i]=clamp(o[0])*255;data[i+1]=clamp(o[1])*255;data[i+2]=clamp(o[2])*255;data[i+3]=255}return data}
function parseCube(txt){
  let n=0,mn=[0,0,0],mx=[1,1,1];const vals=[];
  for(const raw of txt.split(/\r?\n/)){const l=raw.trim();if(!l||l[0]==='#')continue;
    if(/^LUT_3D_SIZE/i.test(l)){n=parseInt(l.split(/\s+/)[1]);continue}
    if(/^DOMAIN_MIN/i.test(l)){mn=l.split(/\s+/).slice(1,4).map(Number);continue}
    if(/^DOMAIN_MAX/i.test(l)){mx=l.split(/\s+/).slice(1,4).map(Number);continue}
    if(/^[A-Z_]/i.test(l))continue;const p=l.split(/\s+/).map(Number);if(p.length>=3&&p.every(isFinite))vals.push(p)}
  if(!n||n<2||n>65||vals.length<n*n*n)throw new Error('Fichier .cube invalide (LUT 3D attendue)');
  return {n,data:cubeToData(n,(r,g,b,i)=>vals[i].slice(0,3).map((v,k)=>(v-mn[k])/((mx[k]-mn[k])||1)))};
}
function builtinLUTs(){
  const lum=(r,g,b)=>r*.2126+g*.7152+b*.0722,mix=(a,b,t)=>a+(b-a)*t,sc=t=>t*t*(3-2*t);
  const defs={
    'lut-teal-orange':['Teal & Orange',(r,g,b)=>{const L=lum(r,g,b),k=sc(L);return [mix(r*.9,r*1.12+.03,k),mix(g*1.02,g*1.0,k),mix(b*1.12+.04,b*.82,k)]}],
    'lut-film-warm':['Film chaud 2383',(r,g,b)=>{const c=[r,g,b].map(v=>sc(sc(v)*.85+v*.15));return [c[0]*1.05+.02,c[1]*.98+.015,c[2]*.86+.03]}],
    'lut-bleach':['Bleach bypass',(r,g,b)=>{const L=lum(r,g,b);return [r,g,b].map(v=>{const d=mix(v,L,.6);return sc(d)*.9+d*.1})}],
    'lut-day-night':['Nuit américaine',(r,g,b)=>{const L=lum(r,g,b);return [L*.35+r*.1,L*.45+g*.12,L*.75+b*.25].map(v=>v*.7)}],
    'lut-luxe-gold':['Luxe doré',(r,g,b)=>{const L=lum(r,g,b);return [r*1.06+.02*(1-L),g*1.01+.01,b*.88+.04*(1-L)].map(v=>mix(v,sc(v),.3))}],
    'lut-clean-white':['Blanc architecture',(r,g,b)=>{const L=lum(r,g,b),k=sc(clamp((L-.55)/.45));return [mix(r,1,k*.35),mix(g,1,k*.35),mix(b*1.02,1,k*.4)]}],
  };
  for(const id in defs){const [name,fn]=defs[id];LUTS[id]={id,name,n:17,data:cubeToData(17,fn),builtin:true}}
}
builtinLUTs();
async function importLUTFile(f){
  try{const txt=await f.text();const {n,data}=parseCube(txt);const id='lut-'+uid();LUTS[id]={id,name:f.name.replace(/\.cube$/i,''),n,data};
    media[id]={id,type:'lut',name:LUTS[id].name,blob:new Blob([txt],{type:'text/plain'})};IDB.put(id,media[id].blob);
    const c=selClip();if(c&&(isMedia(c)||c.kind==='adjust')){c.grade.lut=id;commit();refreshAll()}toast(`LUT « ${LUTS[id].name} » importée (${n}³)`);saveSoon();return id}
  catch(e){toast(e.message||'LUT illisible')}
}

/* ===== colour wheels (lift / gamma / gain), DaVinci-style ===== */
const WHEEL_K={lift:.14,gamma:.45,gain:.4};
function wheelVec(name,w){const [a,r,m]=w;const h=a,base=[0,1,2].map(i=>Math.cos(h-i*2.0944));const mean=0;const k=WHEEL_K[name];return base.map(v=>(v-mean)*r*k+m*k)}
function drawWheel(cn,w){const g=cn.getContext('2d'),s=cn.width,R=s/2-6;g.clearRect(0,0,s,s);
  for(let i=0;i<72;i++){g.beginPath();g.moveTo(s/2,s/2);g.arc(s/2,s/2,R,(i-.6)/72*Math.PI*2,(i+.6)/72*Math.PI*2);g.closePath();
    const ang=i/72*Math.PI*2;const rgb=[0,1,2].map(k=>Math.round(128+100*Math.cos(ang-k*2.0944)));g.fillStyle=`rgb(${rgb})`;g.fill()}
  const gr=g.createRadialGradient(s/2,s/2,0,s/2,s/2,R);gr.addColorStop(0,'rgba(36,40,52,1)');gr.addColorStop(.92,'rgba(36,40,52,.15)');gr.addColorStop(1,'rgba(36,40,52,0)');g.fillStyle=gr;g.beginPath();g.arc(s/2,s/2,R,0,7);g.fill();
  g.strokeStyle='rgba(255,255,255,.18)';g.beginPath();g.moveTo(s/2-6,s/2);g.lineTo(s/2+6,s/2);g.moveTo(s/2,s/2-6);g.lineTo(s/2,s/2+6);g.stroke();
  const x=s/2+Math.cos(w[0])*w[1]*R,y=s/2-Math.sin(w[0])*w[1]*R;g.fillStyle='#fff';g.strokeStyle='#111';g.lineWidth=2;g.beginPath();g.arc(x,y,6,0,7);g.fill();g.stroke()}
function bindWheels(root,c){
  $$('canvas[data-wheel]',root).forEach(cn=>{const name=cn.dataset.wheel;const w=c.grade.wheels[name];drawWheel(cn,w);
    const set=(ev)=>{const r=cn.getBoundingClientRect(),R=r.width/2-6;const dx=ev.clientX-r.left-r.width/2,dy=-(ev.clientY-r.top-r.height/2);w[0]=Math.atan2(dy,dx);w[1]=clamp(Math.hypot(dx,dy)/R);c.grade[name]=wheelVec(name,w);drawWheel(cn,w);req()};
    cn.addEventListener('pointerdown',ev=>{cn.setPointerCapture(ev.pointerId);set(ev);const mv=e2=>set(e2);const up=()=>{cn.removeEventListener('pointermove',mv);cn.removeEventListener('pointerup',up);commit()};cn.addEventListener('pointermove',mv);cn.addEventListener('pointerup',up)});
    cn.addEventListener('dblclick',()=>{w[0]=0;w[1]=0;w[2]=0;c.grade[name]=[0,0,0];drawWheel(cn,w);commit();renderInspector()});
  });
}

const scopeBox=document.createElement('div');scopeBox.id='scopes';scopeBox.hidden=true;
scopeBox.innerHTML='<div class="sc-h"><select id="scopeType" aria-label="Type de scope"><option value="wave">Forme d\'onde</option><option value="parade">Parade RVB</option><option value="hist">Histogramme</option><option value="vec">Vecteurscope</option></select><button class="mini" id="scopeX" aria-label="Fermer les scopes"></button></div><canvas id="scopeCv" width="300" height="170"></canvas>';
const scopeSmall=document.createElement('canvas');scopeSmall.width=160;scopeSmall.height=90;
function drawScopes(){
  if(!S.scopes)return;const t=$('#scopeType').value,cn=$('#scopeCv'),g=cn.getContext('2d'),W=cn.width,H=cn.height;
  const sg=scopeSmall.getContext('2d',{willReadFrequently:true});sg.drawImage(cv,0,0,160,90);const d=sg.getImageData(0,0,160,90).data;
  g.fillStyle='#0B0C11';g.fillRect(0,0,W,H);g.strokeStyle='rgba(255,255,255,.08)';for(let i=1;i<4;i++){g.beginPath();g.moveTo(0,H*i/4);g.lineTo(W,H*i/4);g.stroke()}
  g.globalCompositeOperation='lighter';
  if(t==='hist'){const bins=[new Array(64).fill(0),new Array(64).fill(0),new Array(64).fill(0)];for(let i=0;i<d.length;i+=4)for(let k=0;k<3;k++)bins[k][d[i+k]>>2]++;const mx=Math.max(...bins.flat())||1;
    ['#E5604F','#4FB96F','#5A86E8'].forEach((col,k)=>{g.fillStyle=col+'AA';g.beginPath();g.moveTo(0,H);bins[k].forEach((v,i)=>g.lineTo(i/63*W,H-v/mx*H*.95));g.lineTo(W,H);g.fill()})}
  else if(t==='wave'||t==='parade'){const cols=t==='parade'?['rgba(229,96,79,.35)','rgba(79,185,111,.35)','rgba(90,134,232,.35)']:['rgba(200,230,210,.28)'];
    for(let i=0;i<d.length;i+=4){const px=(i/4)%160;if(t==='wave'){const L=(d[i]*.2126+d[i+1]*.7152+d[i+2]*.0722)/255;g.fillStyle=cols[0];g.fillRect(px/160*W,H-L*H,1.6,1.6)}
      else for(let k=0;k<3;k++){g.fillStyle=cols[k];g.fillRect((k*W/3)+px/160*W/3,H-d[i+k]/255*H,1.2,1.2)}}}
  else{const cx=W/2,cy=H/2,R=H/2-8;g.globalCompositeOperation='source-over';g.strokeStyle='rgba(255,255,255,.18)';g.beginPath();g.arc(cx,cy,R,0,7);g.stroke();g.beginPath();g.moveTo(cx,cy);g.lineTo(cx-R*.55,cy-R*.75);g.stroke();
    g.globalCompositeOperation='lighter';for(let i=0;i<d.length;i+=8){const r=d[i]/255,gg=d[i+1]/255,b=d[i+2]/255;const cb=-.1687*r-.3313*gg+.5*b,cr=.5*r-.4187*gg-.0813*b;g.fillStyle=`rgba(${d[i]},${d[i+1]},${d[i+2]},.5)`;g.fillRect(cx+cb*R*1.8,cy-cr*R*1.8,1.6,1.6)}}
  g.globalCompositeOperation='source-over';
}

/* ===== audio analysis ===== */
async function decodeMono(m,sr=16000){
  if(m._mono&&m._monoSr===sr)return m._mono;if(!m.blob)throw new Error('Média sans fichier');
  const buf=await m.blob.arrayBuffer();const tmp=new (window.OfflineAudioContext||window.webkitOfflineAudioContext)(1,1,44100);
  let ab;try{ab=await tmp.decodeAudioData(buf)}catch(e){throw new Error('Aucune piste audio lisible dans ce fichier')}
  const len=Math.max(1,Math.ceil(ab.duration*sr));const oc=new (window.OfflineAudioContext||window.webkitOfflineAudioContext)(1,len,sr);const src=oc.createBufferSource();src.buffer=ab;src.connect(oc.destination);src.start();
  const r=await oc.startRendering();m._mono=r.getChannelData(0);m._monoSr=sr;return m._mono;
}
async function detectBeats(m){
  if(m.beats)return m.beats;const sr=11025,d=await decodeMono(m,sr),hop=256,win=512;const nF=Math.floor((d.length-win)/hop);if(nF<16)return (m.beats=[]);
  const en=new Float32Array(nF);for(let f=0;f<nF;f++){let s=0;for(let i=0;i<win;i++){const v=d[f*hop+i];s+=v*v}en[f]=Math.log(1e-6+s)}
  const on=new Float32Array(nF);for(let f=1;f<nF;f++)on[f]=Math.max(0,en[f]-en[f-1]);
  const mean=on.reduce((a,b)=>a+b,0)/nF;for(let f=0;f<nF;f++)on[f]=Math.max(0,on[f]-mean);
  const fps=sr/hop;let best=0,bestLag=fps*.5;
  for(let bpm=70;bpm<=170;bpm+=.5){const lag=60/bpm*fps;let s=0;for(let f=0;f+lag*2<nF;f+=1){s+=on[f]*(on[Math.round(f+lag)]+.5*on[Math.round(f+lag*2)])}s*=1+.15*Math.exp(-Math.pow((bpm-118)/40,2));if(s>best){best=s;bestLag=lag}}
  let bo=0,bs=-1;for(let o=0;o<bestLag;o++){let s=0;for(let k=o;k<nF;k+=bestLag)s+=on[Math.round(k)]||0;if(s>bs){bs=s;bo=o}}
  const beats=[];for(let k=bo;k<nF;k+=bestLag)beats.push(+(k/fps).toFixed(3));m.bpm=Math.round(60*fps/bestLag);m.beats=beats;return beats;
}
async function speechSegments(m,{thr=-38,minSil=.35,pad=.12}={}){
  const sr=16000,d=await decodeMono(m,sr),w=320,n=Math.floor(d.length/w);const db=new Float32Array(n);
  for(let i=0;i<n;i++){let s=0;for(let j=0;j<w;j++){const v=d[i*w+j];s+=v*v}db[i]=10*Math.log10(1e-10+s/w)}
  const sorted=[...db].sort((a,b)=>a-b);const ref=sorted[Math.floor(n*.97)]||0;const segs=[];let cur=null;
  for(let i=0;i<n;i++){const t=i*w/sr,on=db[i]>ref+thr;if(on){if(!cur)cur={s:t,e:t+w/sr};else cur.e=t+w/sr}else if(cur&&t-cur.e>minSil){segs.push(cur);cur=null}}
  if(cur)segs.push(cur);return segs.map(s=>({s:Math.max(0,s.s-pad),e:Math.min(d.length/sr,s.e+pad)})).filter(s=>s.e-s.s>.15);
}
async function removeSilences(c){
  const m=media[c.mediaId];if(!m||(c.kind!=='video'&&c.kind!=='audio')){toast('Sélectionnez une vidéo ou un audio parlé');return}
  toast('Analyse de la voix…');let segs;try{segs=await speechSegments(m)}catch(e){toast(e.message);return}
  const a=c.in,b=c.in+c.dur*c.speed;const parts=segs.map(s=>({s:Math.max(a,s.s),e:Math.min(b,s.e)})).filter(s=>s.e-s.s>.15);
  if(parts.length<=1&&parts[0]&&parts[0].e-parts[0].s>(b-a)*.95){toast('Aucun silence à couper');return}
  const removed=(b-a)-parts.reduce((x,p)=>x+p.e-p.s,0);let t=c.start;const tr=trackOf(c);
  P.clips=P.clips.filter(o=>o!==c);if(tr.kind!=='main'||!S.magnet)P.clips.filter(o=>o.trackId===tr.id&&o.start>c.start).forEach(o=>o.start-=removed/c.speed);
  parts.forEach((p,i)=>{const n=JSON.parse(JSON.stringify(c));n.id=uid();n.in=p.s;n.dur=(p.e-p.s)/c.speed;n.start=t;n.trans={type:'none',dur:.6};n.kf={};if(i>0)n.fadeIn=0;t+=n.dur;P.clips.push(n)});
  packTrack(tr);S.sel=null;commit();refreshAll();toast(`${parts.length} plans gardés, ${removed.toFixed(1)} s de silences retirés`);
}
async function normalizeClip(c){const m=media[c.mediaId];if(!m)return;try{const d=await decodeMono(m,16000);const a=Math.floor(c.in*16000),b=Math.min(d.length,Math.floor((c.in+c.dur*c.speed)*16000));let pk=0;for(let i=a;i<b;i++)pk=Math.max(pk,Math.abs(d[i]));if(pk<1e-4){toast('Clip silencieux');return}c.volume=+clamp(.89/pk,.05,2).toFixed(2);commit();renderInspector();toast(`Volume réglé à ${Math.round(c.volume*100)} % (crête −1 dB)`)}catch(e){toast(e.message)}}
async function beatMarkers(){

async function detectScenes(m,onProg){
  const v=document.createElement('video');v.muted=true;v.preload='auto';v.src=m.url;await once(v,'loadeddata');
  const cn=document.createElement('canvas');cn.width=64;cn.height=36;const g=cn.getContext('2d',{willReadFrequently:true});const step=m.dur>120?.5:.25;let prev=null,last=0;const cuts=[];
  for(let t=0;t<m.dur;t+=step){v.currentTime=t;await once(v,'seeked',2500);g.drawImage(v,0,0,64,36);const d=g.getImageData(0,0,64,36).data;const h=new Float32Array(48);
    for(let i=0;i<d.length;i+=4){h[d[i]>>4]++;h[16+(d[i+1]>>4)]++;h[32+(d[i+2]>>4)]++}
    if(prev){let s=0;for(let k=0;k<48;k++)s+=Math.abs(h[k]-prev[k]);s/=(64*36*3*2);if(s>.32&&t-last>.8){cuts.push(t);last=t}}prev=h;onProg&&onProg(t/m.dur)}
  return cuts;
}

/* ===== quick image analysis (exterior/interior, brightness) ===== */
function analyzeImage(src){
  const cn=document.createElement('canvas');cn.width=64;cn.height=36;const g=cn.getContext('2d',{willReadFrequently:true});try{g.drawImage(src,0,0,64,36)}catch(e){return {sky:0,bright:.5}}

  for(let y=0;y<36;y++)for(let x=0;x<64;x++){const i=(y*64+x)*4,r=d[i]/255,gg=d[i+1]/255,b=d[i+2]/255,L=r*.2126+gg*.7152+b*.0722;lum+=L;
    if(y<14){top++;const mx=Math.max(r,gg,b),mn=Math.min(r,gg,b);if((b-Math.max(r,gg*.92)>.05&&L>.35)||(L>.88&&(mx-mn)/mx<.12))sky++}}
  return {sky:sky/top,bright:lum/(64*36),exterior:sky/top>.22};
}

function captionTrack(){let tr=P.tracks.find(t=>t.name==='Sous-titres');if(!tr){tr={id:uid(),kind:'text',name:'Sous-titres'};P.tracks.unshift(tr)}return tr}
function wordsFromText(text,t0,t1,segs){
  const ws=text.replace(/\s+/g,' ').trim().split(' ').filter(Boolean);if(!ws.length)return [];
  let spans=segs&&segs.length?segs.map(s=>({s:Math.max(t0,s.s),e:Math.min(t1,s.e)})).filter(s=>s.e-s.s>.1):[{s:t0,e:t1}];if(!spans.length)spans=[{s:t0,e:t1}];
  const total=spans.reduce((a,s)=>a+s.e-s.s,0),wl=ws.map(w=>Math.max(2,w.length)+1),sum=wl.reduce((a,b)=>a+b,0);

  ws.forEach((w,i)=>{const a=acc/sum;acc+=wl[i];const b=acc/sum;out.push({w,s:+at(a).toFixed(3),e:+at(b).toFixed(3)})});return out;
}

}

/* ===== thumbnail / cover ===== */
function renderThumb(kind,title,sub,badge){
  const [w,h]=kind==='cover'?[1080,1920]:[1280,720];const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');
  const r=Math.max(w/cv.width,h/cv.height);g.drawImage(cv,(w-cv.width*r)/2,(h-cv.height*r)/2,cv.width*r,cv.height*r);
  const gr=g.createLinearGradient(0,h*.35,0,h);gr.addColorStop(0,'rgba(10,11,16,0)');gr.addColorStop(1,'rgba(10,11,16,.88)');g.fillStyle=gr;g.fillRect(0,0,w,h);
  const u=Math.min(w,h)/720,acc=P.brand.color||'#6C5CE7';g.textBaseline='alphabetic';g.textAlign='left';
  const lines=title.toUpperCase().split('\n');g.font=`900 ${kind==='cover'?118:96}px "Montserrat","Inter",sans-serif`;
  let y=h-(kind==='cover'?420:120)*u-(lines.length-1)*96*u;g.lineJoin='round';
  lines.forEach(l=>{g.lineWidth=14*u;g.strokeStyle='rgba(0,0,0,.6)';g.strokeText(l,48*u,y);g.fillStyle='#fff';g.fillText(l,48*u,y);y+=(kind==='cover'?126:100)*u});
  if(sub){g.font=`700 ${44*u}px "Montserrat","Inter",sans-serif`;g.fillStyle=acc;g.fillText(sub,52*u,y+4*u)}
  if(badge){g.font=`900 ${52*u}px "Montserrat","Inter",sans-serif`;const bw=g.measureText(badge).width+56*u;g.fillStyle=acc;rr(g,w-bw-40*u,40*u,bw,88*u,16*u);g.fill();g.fillStyle=pickInk(acc);g.fillText(badge,w-bw-12*u,100*u)}
  return c;
}

const AI={lib:null,pipes:{},state:{},
  async load(){if(this.lib)return this.lib;try{this.lib=await withTimeout(import(AI_CFG.tjs),20000);this.lib.env.allowLocalModels=false;return this.lib}catch(e){throw new Error(AI_BLOCKED)}},
  async pipe(task,model,opts={}){
    const k=task+'|'+model;if(this.pipes[k])return this.pipes[k];const {pipeline}=await this.load();this.state[model]='Téléchargement…';aiUI();
    const mk=device=>pipeline(task,model,{device,...(opts.dtype?{dtype:opts.dtype}:{}),progress_callback:x=>aiProgress(model,x)});
    let p;try{p=await mk(opts.device||(navigator.gpu&&!opts.wasm?'webgpu':'wasm'))}catch(e){if(opts.device==='webgpu')throw e;try{p=await mk('wasm')}catch(e2){this.state[model]='Erreur';aiUI();throw new Error(/fetch|network|Failed/i.test(String(e2))?AI_BLOCKED:String(e2.message||e2))}}
    this.state[model]='Prêt';aiUI();this.pipes[k]=p;return p;
  }
};

function srcCanvas(c,max=1024){
  const src=getSrc(c);if(!src)return null;const sw=src.videoWidth||src.naturalWidth||src.width,sh=src.videoHeight||src.naturalHeight||src.height;const k=Math.min(1,max/Math.max(sw,sh));
  const cn=document.createElement('canvas');cn.width=Math.round(sw*k);cn.height=Math.round(sh*k);cn.getContext('2d').drawImage(src,0,0,cn.width,cn.height);return cn;
}

async function aiTranscribe(c,lang='french'){
  const m=media[c.mediaId];if(!m||(c.kind!=='video'&&c.kind!=='audio')){toast('Sélectionnez une vidéo ou un audio avec de la voix');return}
  if(SRV.has('transcribe'))return srvTranscribe(c,lang);
  try{aiBusy('Préparation de l\'audio…');const d=await decodeMono(m,16000);const a=Math.floor(c.in*16000),b=Math.min(d.length,Math.floor((c.in+c.dur*c.speed)*16000));const slice=d.slice(a,b);
    const asr=await AI.pipe('automatic-speech-recognition','onnx-community/whisper-base_timestamped',{wasm:true});aiBusy('Transcription en cours…');
    const out=await asr(slice,{return_timestamps:'word',chunk_length_s:30,stride_length_s:5,...(lang==='auto'?{}:{language:lang}),task:'transcribe'});
    const words=(out.chunks||[]).map(k=>({w:String(k.text).trim(),s:c.start+k.timestamp[0]/c.speed,e:c.start+(k.timestamp[1]??k.timestamp[0]+.3)/c.speed})).filter(w=>w.w);
    aiBusy('');if(!words.length){toast('Aucune parole détectée');return}
    addCaptionClip(words,'Sous-titres auto');if(c.kind==='video'||c.kind==='audio')c.role='voice';commit();refreshAll();toast(`${words.length} mots transcrits`);
  }catch(e){aiBusy('');toast(e.message||String(e))}
}

const SRV={url:'',token:'',caps:{},
  load(){try{const o=JSON.parse(localStorage.getItem('topclap-srv')||'{}');this.url=o.url||'';this.token=o.token||''}catch(e){}},
  save(){try{localStorage.setItem('topclap-srv',JSON.stringify({url:this.url,token:this.token}))}catch(e){}},
  has(cap){return !!(this.url&&this.caps&&this.caps[cap])},
  headers(){return this.token?{Authorization:'Bearer '+this.token}:{}},
  async health(){if(!this.url){this.caps={};return null}try{const r=await fetch(this.url.replace(/\/$/,'')+'/health',{headers:this.headers()});const j=await r.json();this.caps=j.capabilities||{};return j}catch(e){this.caps={};throw new Error('Serveur injoignable : vérifiez l\'adresse, le CORS et que le serveur tourne.')}},
  async call(path,data,json=false){
    const body=new FormData();for(const k in data){const v=data[k];if(v instanceof Blob)body.append(k,v,v.name||k);else body.append(k,typeof v==='object'?JSON.stringify(v):String(v))}
    const r=await fetch(this.url.replace(/\/$/,'')+path,{method:'POST',body,headers:this.headers()});
    if(!r.ok){let msg=r.status+' '+r.statusText;try{const j=await r.json();msg=j.detail||msg}catch(e){}throw new Error('Serveur IA : '+msg)}
    return json?r.json():r.blob();
  }
};

    case'transcribe':case'ai-transcribe':return need(x=>x.kind==='video'||x.kind==='audio','Sélectionnez une vidéo ou un audio avec de la voix')&&aiTranscribe(c,'french');
    case'srtcap':return $('#srtIn').click();
    case'script2cap':{const txt=($('#capScript')||{}).value||'';if(!txt.trim())return toast('Collez d\'abord un texte');const voice=P.clips.find(isVoice);let words;
      if(voice&&media[voice.mediaId]){let segs=null;try{segs=(await speechSegments(media[voice.mediaId],{thr:-40,minSil:.25,pad:.05})).map(s=>({s:voice.start+(s.s-voice.in)/voice.speed,e:voice.start+(s.e-voice.in)/voice.speed}))}catch(e){}words=wordsFromText(txt,voice.start,voice.start+voice.dur,segs)}
      else words=wordsFromText(txt,.3,projDur()-.3);addCaptionClip(words,'Sous-titres',S.capStyle||'karaoke');commit();refreshAll();return toast(voice?'Texte synchronisé sur la voix off':'Texte réparti sur toute la durée')}
    case'social':return openSocial();
    case'thumb':return openThumb();
    case'multi':return openExport(['16:9','9:16','1:1','4:5']);
    case'ai-tts':{const r=await askText('Voix off IA','Texte à lire (voix française). Les musiques baisseront automatiquement sous la voix.',scriptFor(A_OPTS),PIPER_VOICES);if(!r)return;const vc=await aiTTS(r.text,r.opt);if(vc){commit();refreshAll();toast('Voix off ajoutée à la tête de lecture')}return}
    case'ai-depth':return need(isMedia,'Sélectionnez une photo')&&aiDepth(c);
    case'ai-bg':return need(x=>x.kind==='image'||x.kind==='scene','Sélectionnez une photo')&&aiRemoveBg(c);
    case'ai-up':return need(x=>x.kind==='image','Sélectionnez une photo importée')&&aiUpscale(c);
    case's-night':return srvNeed('image_edit')&&need(x=>x.kind==='image'||x.kind==='scene','Sélectionnez une photo')&&serverImageTool(c,'/image/edit',{prompt:IMG_PROMPTS.night},'nuit');
    case's-staging':{if(!srvNeed('image_edit')||!need(x=>x.kind==='image'||x.kind==='scene','Sélectionnez la photo d\'une pièce'))return;const r=await askText('Home staging virtuel','Précisez le style ou laissez le texte proposé.',IMG_PROMPTS.staging_modern,[['m','Moderne'],['s','Scandinave']]);if(!r)return;return serverImageTool(c,'/image/edit',{prompt:r.opt==='s'&&r.text===IMG_PROMPTS.staging_modern?IMG_PROMPTS.staging_scandi:r.text},'meublé')}
    case's-declutter':return srvNeed('image_edit')&&need(x=>x.kind==='image'||x.kind==='scene','Sélectionnez une photo')&&serverImageTool(c,'/image/edit',{prompt:IMG_PROMPTS.declutter},'rangé');
    case's-i2v':{if(!srvNeed('img2video')||!need(x=>x.kind==='image'||x.kind==='scene','Sélectionnez une photo'))return;const r=await askText('Photo → vidéo','Décrivez le mouvement (en anglais de préférence).','Slow cinematic drone push-in towards the house, gentle parallax, natural light, real estate video');if(!r)return;return serverImageTool(c,'/video/image-to-video',{prompt:r.text,seconds:5},'animée')}
    case's-music':{if(!srvNeed('music'))return;const r=await askText('Musique sur mesure','Style, ambiance, tempo (en anglais de préférence).','warm acoustic lounge, piano and soft guitar, 100 bpm, uplifting, real estate');if(!r)return;try{aiBusy('Composition…');const blob=await SRV.call('/audio/music',{prompt:r.text,seconds:Math.ceil(projDur())});aiBusy('');const idm=uid();const m=await registerMedia(idm,blob,{type:'audio',name:'Musique IA'});IDB.put(idm,blob);addMediaToTimeline(m)}catch(e){aiBusy('');toast(e.message)}return}
    case's-denoise':return srvNeed('denoise')&&need(x=>x.kind==='video'||x.kind==='audio','Sélectionnez un clip avec de la voix')&&serverAudioTool(c,'/audio/denoise',{},'Voix débruitée');
    case's-stems':return srvNeed('stems')&&need(x=>x.kind==='video'||x.kind==='audio','Sélectionnez un clip audio ou vidéo')&&serverAudioTool(c,'/audio/stems',{stem:'vocals'},'Voix isolée');
    case's-stab':return srvNeed('stabilize')&&need(x=>x.kind==='video','Sélectionnez une vidéo')&&serverImageTool(c,'/video/stabilize',{},'stabilisée');
    case's-slowmo':return srvNeed('stabilize')&&need(x=>x.kind==='video','Sélectionnez une vidéo')&&serverImageTool(c,'/video/interpolate',{fps:60},'60 i/s');
    case's-gen':{if(!srvNeed('image_gen'))return;const r=await askText('Générer une image','Décrivez l\'image (en anglais de préférence).','Luxury Provençal villa at golden hour, olive trees, pool, architectural photography');if(!r)return;try{aiBusy('Génération…');const [w,h]=baseWH();const blob=await SRV.call('/image/generate',{prompt:r.text,width:w>h?1344:768,height:w>h?768:1344});aiBusy('');const idm=uid();const m=await registerMedia(idm,blob,{type:'image',name:'Image IA'});IDB.put(idm,blob);addMediaToTimeline(m)}catch(e){aiBusy('');toast(e.message)}return}
    case'srv-test':{SRV.url=($('#srvUrl')||{}).value.trim();SRV.token=($('#srvTok')||{}).value.trim();SRV.save();const st=$('#srvStatus');if(st)st.textContent='Connexion…';try{const j=await SRV.health();toast(j?'Serveur IA connecté':'Adresse vide');}catch(e){toast(e.message)}renderPanel();return}
  }
}

/* ===== 29-refresh-boot.js ===== */
/* ---------- refresh & boot ---------- */
function refreshAll(){renderTimeline();renderInspector();renderPanel();updUndo();renderGuides();req()}
async function boot(){
  renderRail();renderTlBar();updateTransport();stageBox.appendChild(scopeBox);$('#scopeX').innerHTML=ic('x');S.capStyle='karaoke';
  let saved=null;try{saved=JSON.parse(localStorage.getItem(LS_KEY)||'null')}catch(e){}
  if(saved&&saved.P&&saved.P.clips){
    for(const m of saved.media||[]){if(m.demo){ensureDemoMusic(m.demo,m.id);continue}const blob=await IDB.get(m.id);if(blob){try{await registerMedia(m.id,blob,{type:m.type,name:m.name})}catch(e){}}}
    Object.assign(P,saved.P);normalizeProject();const before=P.clips.length;P.clips=P.clips.filter(c=>!c.mediaId||media[c.mediaId]);
    if(saved.S){S.pps=saved.S.pps||60;S.magnet=saved.S.magnet!==false;S.snap=saved.S.snap!==false}
    if(before!==P.clips.length)setTimeout(()=>toast('Certains médias n\'ont pas été retrouvés : réimportez-les.'),800);
    if(!P.clips.length)buildDemo();
  }else buildDemo();
  if(isPhone()){S.pq=.4;S.pps=40}
  $('#aspectSel').value=P.aspect;$('#projName').value=P.name;setRes(S.pq);renderTlBar();
  commit();refreshAll();
  if(document.fonts){document.fonts.addEventListener&&document.fonts.addEventListener('loadingdone',req);document.fonts.ready.then(req)}
  requestAnimationFrame(tick);
}
addEventListener('resize',()=>{fitViewport();renderTimeline()});
boot();
